<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Card List</title>
    <style>
        body {
            background-color: #222;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .container {
            max-width: 1600px;
            margin: 50px auto;
            padding: 20px;
            background: #333;
            border-radius: 10px;
        }
        h1 {
            margin-bottom: 20px;
        }
.paintbrush-icon {
        position: absolute;
        top: 10px;
        right: 15px;
        cursor: pointer;
        font-size: 40px;
        color: white;
    }
    .color-input-container {
        position: absolute;
        top: 80px;
        right: 10px;
        display: none;
        flex-direction: column;
        gap: 10px;
    }
    .color-input {
        padding: 5px;
        border-radius: 5px;
        border: none;
        font-size: 16px;
    }
    .reset-btn {
        padding: 5px 10px;
        background-color: red;
        color: white;
        border-radius: 5px;
        cursor: pointer;
    }
.button-container {
    margin-bottom: 20px;
    display: flex;
    justify-content: center; /* This will center the buttons */
    gap: 10px; /* Optional: adds space between buttons */
}
        button {
            padding: 10px 20px;
            margin: 5px;
            background-color: #444;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #555;
        }
        .highlighted {
            background-color: #4CAF50;
            border: 2px solid #3e8e41;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: #444;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            transition: transform 0.3s;
        }
        .card div {
            font-family: "Courier New", monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 16px; /* Set a fixed font size */
            line-height: 1.2; /* Ensure consistent line height */
        }
        .card img {
            max-width: 100%;
            height: auto;
        }
        .card button {
            margin-top: 10px;
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }
        .flag {
            width: 20px;
            height: 15px;
            display: inline-block;
            background-size: cover;
            background-position: center;
            border-radius: 5px;
            border: 1px solid black;
        }
        .message {
            color: #4CAF50;
            margin-top: 20px;
        }
        .form-container {
            margin-top: 20px;
            display: none;
            flex-direction: column;
            align-items: center;
        }
        .form-container input {
            margin: 5px;
            padding: 10px;
            width: 250px;
            border-radius: 5px;
            background-color: #555;
            color: white;
            border: none;
        }
        .form-container input:focus {
            outline: none;
            background-color: #666;
        }
        #completionProgress {
            font-size: 24px;
            font-weight: bold;
        }
        .collected-btn {
            background-color: green;
            color: white;
        }
        .not-collected-btn {
            background-color: red;
            color: white;
        }
        .delete-card-mode .card {
            cursor: pointer;
        }
        .delete-card-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #444;
            color: #fff;
            padding: 20px;
            border: 1px solid #666;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: none;
            border-radius: 8px;
        }
        .delete-card-modal.active {
            display: block;
        }
        .delete-card-modal p {
            margin-bottom: 20px;
        }
        
        /* Delete card modal specific styles */
        .delete-card-modal .ok-button {
            background-color: #007BFF; /* Blue background for OK button */
            color: white;
            font-size: 16px;
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .delete-card-modal .ok-button:hover {
            background-color: #0056b3; /* Darker blue on hover */
        }

        /* Other modal buttons (delete, cancel) */
        .delete-card-modal .delete-btn {
            background-color: red;
            border: 2px solid #cc0000;
        }
        .delete-card-modal .delete-btn:hover {
            background-color: #cc0000;
        }
        .delete-card-modal .cancel-btn {
            background-color: #666;
            border: 2px solid #555;
        }
        .delete-card-modal .cancel-btn:hover {
            background-color: #555;
        }

        .rearrange-button {
            box-shadow: inset 0 0 0 2px blue; /* Inward blue border */
        }

        .delete-button {
            box-shadow: inset 0 0 0 2px red; /* Inward red border */
        }

        .cancel-delete-button {
            box-shadow: inset 0 0 0 2px red; /* Inward red border */
        }

        .gold-star {
            font-size: 0.8em; /* Make the star slightly smaller */
            position: relative;
            top: -2px; /* Raise it slightly */
        }
.card.rearrange-active {
    box-shadow: 0 0 5px 2px rgba(0, 0, 255, 0.5); /* Thin blue box-shadow */
}
.button-container {
    display: flex;
    align-items: center;
}

.button-image {
    width: 20px;  /* Adjust the size as needed */
    height: auto;
    margin: 0 10px;  /* Space between the images and button */
}
    </style>
  <link rel="icon" href="favicon.ico">
</head>


<body>
    <div class="paintbrush-icon" onclick="toggleColorInput()">🎨</div>
    <div class="color-input-container" id="colorInputContainer">
        <input type="text" id="colorInput" class="color-input" placeholder="Enter colour (hex or rgb)" />
        <button onclick="changeBackgroundColor()">Change Colour</button>
        <button onclick="resetBackgroundColor()">Reset</button>
    </div>
    <div class="container">
        <h1 id="listTitle">Pokémon Card List</h1>

        <!-- Progress and List Navigation -->
        <div class="button-container">
            <button onclick="goHome()">📝 Back to Home</button>
            <button id="addCardButton" onclick="toggleAddCardForm()">➕ Add Card</button>
            <button onclick="toggleRearrange()">🔄 Rearrange Cards</button>
            <button id="deleteButton" onclick="toggleDeleteCardMode()">❌ Delete Cards</button>
        </div>

        <div id="completionProgress">0/0 collected</div>
	    <button id="toggleCollectedButton" onclick="toggleHideCollectedCards()">Hide/Show Collected Cards</button>


<!-- Add Card Form -->
<div class="form-container" id="addCardForm">
    <input type="text" id="cardName" placeholder="Card Name" required />
    <input type="text" id="cardNumber" placeholder="Card Number" required />
    <input type="text" id="cardSet" placeholder="Expansion (optional)" />
    <input type="text" id="cardVariant" placeholder="Variant (optional)" />
    <input type="url" id="cardImageUrl" placeholder="Image URL (optional)" />
    
    <!-- Add images next to the button -->
    <div class="button-container">
        <img src="https://pngimg.com/d/pokeball_PNG7.png" alt="Left Image" class="button-image" />
        <button onclick="addCard()">Add Card</button>
        <img src="https://pngimg.com/d/pokeball_PNG7.png" alt="Right Image" class="button-image" />
    </div>
</div>


        <!-- Cards Grid -->
        <div class="card-grid" id="cardGrid"></div>

        <!-- Message -->
        <div class="message" id="message"></div>
    </div>

    <!-- Delete Card Modal -->
    <div id="deleteCardModal" class="delete-card-modal">
        <p id="deleteCardText"></p>
        <button class="delete-btn delete-button" onclick="deleteCard()">Yes, Delete</button>
        <button class="cancel-btn" onclick="cancelDelete()">Cancel</button>
    </div>

<!-- Error Modal -->
<div id="errorModal" class="delete-card-modal">
    <p id="errorMessage"></p>
    <button class="ok-button" onclick="closeErrorModal()">OK</button>
</div>

<!-- Rearrange Mode Modal -->
<div id="rearrangeModal" class="delete-card-modal">
    <p id="rearrangeModalText">Drag and drop cards to rearrange.</p>
    <button class="ok-button" onclick="closeRearrangeModal()">OK</button>
</div>

<div id="imageEditModal" class="delete-card-modal">
    <p>Edit Image URL</p>
    <input type="url" id="newImageUrl" placeholder="Enter image URL" />
    <button class="ok-button" onclick="updateImageUrl()">OK</button>
    <button class="cancel-btn" onclick="closeImageEditModal()">Cancel</button>
</div>

    <script>
// Toggle the visibility of the color input container
function toggleColorInput() {
    const colorInputContainer = document.getElementById('colorInputContainer');
    colorInputContainer.style.display = colorInputContainer.style.display === 'none' || colorInputContainer.style.display === '' ? 'flex' : 'none';
}

// Change the background color of the body
function changeBackgroundColor() {
    const colorInput = document.getElementById('colorInput').value;
    const body = document.body;
    
    // Apply the new background color if it's valid
    if (isValidColor(colorInput)) {
        body.style.backgroundColor = colorInput;
        // Save the color for the current list
        currentList[listIndex].backgroundColor = colorInput;
        localStorage.setItem('pokemonLists', JSON.stringify(currentList));  // Save updated list with color
               document.getElementById('colorInput').value = ''; // Clear the input
 // Close the color input editor
        document.getElementById('colorInputContainer').style.display = 'none'; 
    } else {
        alert('Please enter a valid color (hex or rgb).');
    }
}

// Check if the input is a valid color
function isValidColor(color) {
    const s = new Option().style;
    s.color = color;
    return s.color !== '';
}

// Reset the background color to the default color (#222)
function resetBackgroundColor() {
    document.body.style.backgroundColor = '#222';
// Save the color for the current list
        currentList[listIndex].backgroundColor = colorInput;
        localStorage.setItem('pokemonLists', JSON.stringify(currentList));  // Save updated list with color
        document.getElementById('colorInput').value = ''; // Clear the input
    document.getElementById('colorInputContainer').style.display = 'none'; // Hide the input container
}

        // Placeholder for list data
        let currentList = JSON.parse(localStorage.getItem('pokemonLists')) || [];
        let listIndex = localStorage.getItem('currentList');
        let cards = currentList[listIndex]?.cards || [];
        let isDeleteCardMode = false;
        let cardToDelete = null;
        let isRearrangeMode = false;  // Add this flag for rearranging mode
        let isAddingCard = false; // Flag to track if the "Add Card" form is open
// Load the saved state for hiding collected cards from localStorage
let isCollectedHidden = JSON.parse(localStorage.getItem('isCollectedHidden')) || false;

// Load card grid and progress
function loadCards() {
    const cardGrid = document.getElementById('cardGrid');
    const completionProgress = document.getElementById('completionProgress');
    const listTitle = document.getElementById('listTitle');
    const addCardButton = document.getElementById('addCardButton');
    const toggleCollectedButton = document.getElementById('toggleCollectedButton'); // Add this to target the button

    cardGrid.innerHTML = '';

    // Load the list title dynamically
    listTitle.textContent = currentList[listIndex]?.name || 'Pokémon Card List';

    // Load and apply the saved background color for the current list
    document.body.style.backgroundColor = currentList[listIndex]?.backgroundColor || '#222';

    // Get the visibility setting for collected cards from the active list
    isCollectedHidden = currentList[listIndex]?.isCollectedHidden || false; // Default to false if not set

    // Set button text based on the visibility state of collected cards
    toggleCollectedButton.textContent = isCollectedHidden ? 'Show Collected Cards' : 'Hide Collected Cards';

    let collected = 0;
    let totalCards = 0;  // Track total number of cards, including hidden ones
    let visibleCollected = 0; // Track the collected cards that are visible

    // Loop over all cards to calculate progress
    cards.forEach((card, index) => {
        totalCards++; // Increment totalCards for every card (including hidden)

        // If we're hiding collected cards and the card is collected, skip it from the grid
        if (isCollectedHidden && card.collected) {
            collected++; // Count hidden collected cards
            return; // Skip this card if it is collected and we are hiding collected cards
        }

        // Otherwise, create the card element for visible cards
        const cardElement = document.createElement('div');
        cardElement.className = 'card';

        // Add draggable attribute when in rearrange mode
        if (isRearrangeMode) {
            cardElement.classList.add('rearrange-active');
            cardElement.setAttribute('draggable', 'true');
            cardElement.addEventListener('dragstart', (e) => handleDragStart(e, index));
            cardElement.addEventListener('dragover', (e) => handleDragOver(e));
            cardElement.addEventListener('drop', (e) => handleDrop(e, index));
        }

        cardElement.innerHTML = `
            <img 
                src="${card.image || 'https://archives.bulbagarden.net/media/upload/1/17/Cardback.jpg'}" 
                alt="${card.name}" 
                onclick="openImageEditModal(${index})" 
                style="cursor: ${card.image ? 'default' : 'pointer'};">
            <div class="card-header">
                <div class="flag" style="background-image: url('${/[\u3040-\u309F\u30A0-\u30FF]/.test(card.name) ? 'https://upload.wikimedia.org/wikipedia/en/9/9e/Flag_of_Japan.svg' : 'https://upload.wikimedia.org/wikipedia/en/a/ae/Flag_of_the_United_Kingdom.svg'}');"></div>
                <div>${card.number}</div>
            </div>
<div style="font-family: 'Courier New', monospace; margin-top: 4px;">${card.name}</div>
<div title="${card.variant || '-'}">${card.variant || '-'}</div>
<div 
    style="font-size: 14px; font-family: 'Courier New', monospace; margin-top: 4px;" 
    title="${card.set || '-'}"
>
    ${card.set || '-'}
</div>

            <button class="${card.collected ? 'collected-btn' : 'not-collected-btn'}" onclick="toggleCollected(${index})">${card.collected ? 'Collected' : 'Not Collected'}</button>
            ${isDeleteCardMode ? `<button class="delete-button" onclick="showDeleteModal(${index})">❌ Delete</button>` : ''} 
        `;
        cardGrid.appendChild(cardElement);

        // If the card is collected, increment the collected count (visible or hidden)
        if (card.collected) {
            collected++;
        }

        // If the card is collected and visible, increment the visibleCollected count
        if (!isCollectedHidden && card.collected) {
            visibleCollected++;
        }
    });

    // Calculate the percentage of collected cards based on total collected cards (visible + hidden)
    const totalCollectedPercentage = totalCards === 0 ? 0 : Math.round((collected / totalCards) * 100);
    const visiblePercentage = totalCards === 0 ? 0 : Math.round((visibleCollected / totalCards) * 100);

    const goldStar = (visiblePercentage === 100 && totalCards > 0) ? `<span class="gold-star">⭐</span>` : '';

    // Update collection progress (tracks total collected cards and total cards)
    completionProgress.innerHTML = `${collected}/${totalCards} collected | ${totalCollectedPercentage}%${goldStar}`;

    // Highlight the "Add Card" button if there are no cards and the button is not in "Cancel Add" mode
    if (totalCards === 0 && !isAddingCard) {
        addCardButton.classList.add('highlighted');
    } else {
        addCardButton.classList.remove('highlighted');
    }
}


function toggleHideCollectedCards() {
    isCollectedHidden = !isCollectedHidden; // Toggle the flag for the active list

    // Update the current list in localStorage with the new visibility setting
    currentList[listIndex].isCollectedHidden = isCollectedHidden;
    localStorage.setItem('pokemonLists', JSON.stringify(currentList)); // Save the active list with the updated setting

    loadCards(); // Reload the cards to apply the change
}


        // Handle drag start event
        function handleDragStart(e, index) {
            e.dataTransfer.setData('cardIndex', index); 
        }

        // Handle drag over event
        function handleDragOver(e) {
            e.preventDefault();
        }

        // Handle drop event to swap cards
        function handleDrop(e, index) {
            const draggedIndex = e.dataTransfer.getData('cardIndex');
            if (draggedIndex !== index) {
                const draggedCard = cards[draggedIndex];
                cards.splice(draggedIndex, 1);
                cards.splice(index, 0, draggedCard);
                localStorage.setItem('pokemonLists', JSON.stringify(currentList));
                loadCards();
            }
        }
// Show error modal
function showErrorModal(message) {
    const errorMessage = document.getElementById('errorMessage');
    errorMessage.textContent = message; // Set the message dynamically
    document.getElementById('errorModal').classList.add('active');
}

// Close error modal
function closeErrorModal() {
    document.getElementById('errorModal').classList.remove('active');
}
        // Toggle rearranging mode
function toggleRearrange() {
    isRearrangeMode = !isRearrangeMode;

    const rearrangeButton = document.querySelector('button[onclick="toggleRearrange()"]');
    const rearrangeModal = document.getElementById('rearrangeModal');
    const rearrangeModalText = document.getElementById('rearrangeModalText');

    if (isRearrangeMode) {
        rearrangeButton.textContent = '🔄 Cancel Rearrange';
        rearrangeButton.classList.add('rearrange-button');  // Add the blue border class
        rearrangeModalText.textContent = "Drag and drop cards to rearrange.";  // Show message when rearrange mode is active
        rearrangeModal.classList.add('active');  // Ensure modal is visible
    } else {
        rearrangeButton.textContent = '🔄 Rearrange Cards';
        rearrangeButton.classList.remove('rearrange-button');  // Remove the blue border class
        rearrangeModal.classList.remove('active');  // Hide the modal when rearrange mode is inactive
    }

    loadCards();
}

// Function to close the modal
function closeRearrangeModal() {
    document.getElementById('rearrangeModal').classList.remove('active');
}

        // Toggle collected status of a card
        function toggleCollected(index) {
            cards[index].collected = !cards[index].collected;
            localStorage.setItem('pokemonLists', JSON.stringify(currentList));
            loadCards();
        }

        // Add card to the list
        function addCard() {
            const cardName = document.getElementById('cardName').value;
            const cardNumber = document.getElementById('cardNumber').value;
            const cardSet = document.getElementById('cardSet').value;
            const cardVariant = document.getElementById('cardVariant').value;
            const cardImageUrl = document.getElementById('cardImageUrl').value;

    if (!cardName || !cardNumber) {
        showErrorModal("Please fill in both Card Name and Card Number.");
        return;
    }

            const newCard = {
                name: cardName,
                number: cardNumber,
                set: cardSet,
                variant: cardVariant,
                image: cardImageUrl,
                collected: false
            };

            cards.push(newCard);
            localStorage.setItem('pokemonLists', JSON.stringify(currentList));
            loadCards();

            // Manually reset the input fields
            document.getElementById('cardName').value = '';
            document.getElementById('cardNumber').value = '';
            document.getElementById('cardSet').value = '';
            document.getElementById('cardVariant').value = '';
            document.getElementById('cardImageUrl').value = '';

            toggleAddCardForm(); // Close form after adding the card
        }
// Toggle add card form visibility
function toggleAddCardForm() {
    const addCardForm = document.getElementById('addCardForm');
    const addCardButton = document.getElementById('addCardButton');
    
    if (addCardForm.style.display === 'none' || addCardForm.style.display === '') {
        addCardForm.style.display = 'flex';
        addCardButton.textContent = '➖ Cancel Add';
        isAddingCard = true; // Set flag to true when form is visible
        addCardButton.style.boxShadow = 'inset 0 0 0 2px green'; // Add green box-shadow
    } else {
        addCardForm.style.display = 'none';
        addCardButton.textContent = '➕ Add Card';
        isAddingCard = false; // Set flag to false when form is hidden
        addCardButton.style.boxShadow = ''; // Remove box-shadow
    }

    loadCards(); // Reapply the correct button highlight state
}
// Open the Image Edit Modal with the selected card's index
function openImageEditModal(index) {
    const card = cards[index];
    const newImageUrlInput = document.getElementById('newImageUrl');
    
    // Check if the current image is the default image
    if (card.image === '' || !card.image) {
        newImageUrlInput.value = card.image || ''; // Pre-fill with current image URL (if any)
        document.getElementById('imageEditModal').classList.add('active');
        // Store the index of the card we're editing
        window.selectedCardIndex = index;
    } 
    // No need for else block if nothing should happen
}

// Close the Image Edit Modal
function closeImageEditModal() {
    document.getElementById('imageEditModal').classList.remove('active');
}

// Update the image URL of the selected card
function updateImageUrl() {
    const newImageUrl = document.getElementById('newImageUrl').value;
    if (newImageUrl) {
        // Update the card with the new image URL
        cards[window.selectedCardIndex].image = newImageUrl;
        localStorage.setItem('pokemonLists', JSON.stringify(currentList)); // Save changes
        loadCards(); // Reload the card grid
        closeImageEditModal(); // Close the modal
    } else {
        showErrorModal("Please enter a valid image URL.");
    }
}
        // Toggle delete card mode
function toggleDeleteCardMode() {
    isDeleteCardMode = !isDeleteCardMode;
    const deleteButton = document.getElementById('deleteButton');
    
    // Change the button text depending on the mode
    if (isDeleteCardMode) {
        deleteButton.textContent = '❌ Cancel Delete';
        deleteButton.classList.add('cancel-delete-button');  // Add the red border class
    } else {
        deleteButton.textContent = '❌ Delete Cards';
        deleteButton.classList.remove('cancel-delete-button');  // Remove the red border class
    }

    loadCards();
}
// Show delete card modal
function showDeleteModal(index) {
    cardToDelete = index;
    const deleteCardText = document.getElementById('deleteCardText');
    
    // Check if variant is empty or undefined
    const variantText = cards[index].variant ? ` ${cards[index].variant}` : '';
    
    // Update the text content with no extra space if no variant
    deleteCardText.textContent = `Are you sure you want to delete ${cards[index].name} ${cards[index].number}${variantText}?`;
    
    document.getElementById('deleteCardModal').classList.add('active');
}

        // Delete card
        function deleteCard() {
            cards.splice(cardToDelete, 1);
            localStorage.setItem('pokemonLists', JSON.stringify(currentList));
            loadCards();
            document.getElementById('deleteCardModal').classList.remove('active');
        }

        // Cancel delete
        function cancelDelete() {
            document.getElementById('deleteCardModal').classList.remove('active');
        }

        // Go back to the home page
        function goHome() {
            window.location.href = "index.html"; // Change to your actual home page path
        }

        // Initialize
        loadCards();
    </script>
